  @node(label: "actions", table: "actions", schema: "agentiq")
  @key(fields: ["eventId"]) {
  id:                   ID!
  eventId:              ID!     @column(name: "event_id")
  skipSummarization:    Boolean @column(name: "skip_summarization")
  transferToAgent:      String  @column(name: "transfer_to_agent")
  escalate:             Boolean
  requestedAuthConfigs: JSON    @column(name: "requested_auth_configs", type: "json")

  stateDeltas: [StateDelta!]! @relationship(
    type: "SETS", direction: OUT
    table: "state_delta", schema: "agentiq"
    sourceKey: ["actions_id"], destKey: ["id"]
  )

  artifactDeltas: [ArtifactDelta!]! @relationship(
    type: "PRODUCES", direction: OUT
    table: "artifact_delta", schema: "agentiq"
    sourceKey: ["actions_id"], destKey: ["id"]
  )
}

"""
One key of an event's `EventActions.StateDelta`.

