# ---------------------------------------------------------------------------
# How SPEC.md §7.1's idealised vocabulary maps onto the one gopgql implements
# ---------------------------------------------------------------------------
#
# `schema/dbos.graphql` records the same translation for §7.3 and it is
# unchanged here:
#
#   @table(name:, schema:)     ->  @node(label:, table:, schema:)
#   @vertex(key: [cols])       ->  @key(fields: [graphql field names])
#   @edge(from:, to:, label:)  ->  @relationship(type:, direction:, table:,
#                                                schema:, sourceKey:, destKey:)
