# Event
# ---------------------------------------------------------------------------

"""
Mirrors google.golang.org/adk/v2/session.Event, which embeds model.LLMResponse.
Partial events are never stored (SPEC.md §9.4, D5).

Events are normalized rows, not blobs (D3): the parts of an event are rows in
`agentiq.part`, so the property graph and the sibling memory project can query
them.

`stepFunctionId` and `workflowUuid` are the provenance columns. Together they
name the `(workflow_uuid, function_id)` of the DBOS step that produced the
event — the substrate of `Event ──PRODUCED_BY──▶ Step` (SPEC.md §6.2).
"""
type Event
  @node(label: "event", table: "event", schema: "agentiq")
  @key(fields: ["sessionId", "adkId"]) {
  id:                 ID!
  adkId:              String!   @column(name: "adk_id")
  sessionId:          ID!       @column(name: "session_id")
  sequence:           Int!
  invocationId:       String!   @column(name: "invocation_id")
  author:             String!
  branch:             String
  timestamp:          DateTime!
  turnComplete:       Boolean!  @column(name: "turn_complete")
  interrupted:        Boolean!
  isolationScope:     String    @column(name: "isolation_scope")
  errorCode:          String    @column(name: "error_code")
  errorMessage:       String    @column(name: "error_message")
  contentRole:        String    @column(name: "content_role")
  longRunningToolIds: [String!] @column(name: "long_running_tool_ids")
  requestedInput:     JSON      @column(name: "requested_input", type: "json")
  routes:             JSON      @column(type: "json")
  nodeInfo:           JSON      @column(name: "node_info", type: "json")
  groundingMetadata:  JSON      @column(name: "grounding_metadata", type: "json")
  usageMetadata:      JSON      @column(name: "usage_metadata", type: "json")
  citationMetadata:   JSON      @column(name: "citation_metadata", type: "json")
  customMetadata:     JSON      @column(name: "custom_metadata", type: "json")

  stepFunctionId:     Int       @column(name: "step_function_id")
  workflowUuid:       String    @column(name: "workflow_uuid")

  parts: [Part!]! @relationship(
    type: "HAS_PART", direction: OUT
    table: "part", schema: "agentiq"
    sourceKey: ["event_id"], destKey: ["id"]
  )

  actions: [Actions!]! @relationship(
    type: "HAS_ACTIONS", direction: OUT
    table: "actions", schema: "agentiq"
    sourceKey: ["event_id"], destKey: ["id"]
  )
}

