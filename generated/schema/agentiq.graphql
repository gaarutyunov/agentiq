# bare (`createdAt`, `lastUpdateAt`, `sequence`, `updatedAt`).
#
# ---------------------------------------------------------------------------
# Surrogate keys: every owned type carries `id: ID!`, and it is a uuid
# ---------------------------------------------------------------------------
#
# gopgql identifies a row it owns by a surrogate key and only by a surrogate
# key. `sdl/sdl.go`'s `validateKey` rejects an owned `@node` that does not
# declare `id: ID!` ("type Session must declare a surrogate key field
# `id: ID!`"), rejects an `id` of any other type ("Session.id must be `ID!`
# (surrogate uuid keys only)") and rejects `@column(type:)` on it ("Session.id
# cannot override its type: the surrogate key is a uuid primary key"). A
# natural `@key(fields:)` is accepted *alongside* it — as a UNIQUE constraint,
# not as the identity — and standing alone only on a `@readonly` type.
#
