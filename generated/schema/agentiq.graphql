# event by ADK's `Event.ID`, both `string`. Those are not uuids and cannot be
# made into uuids: `session/sessiontestsuite` appends events with
# `ID: "event1"` and `ID: strconv.Itoa(i)` unconditionally, and creates sessions
# with `SessionID: "test-session-id"` and `"s1"`. A uuid column cannot store
# them and the conformance suite — M2's acceptance — fails on the first append.
#
# So the ADK-visible identifier is its own text column, `adk_id`, and the
# §7.1/§6.1 identity is expressed as the natural `@key`:
#
#   Session   (app_name, user_id, adk_id)   §6.1 `(app_name, user_id, id)`
#   Event     (session_id, adk_id)          §6.1 `(session_id, id)`
