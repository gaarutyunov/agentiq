# those two names are already taken by the uuid foreign keys, and gopgql
# requires one type per property name across the whole graph (see below).
#
# The surrogate is invisible to SPEC.md §7.2: it is not a field of
# `session.Event`, so it cannot perturb `json.Marshal(load(store(E)))` — the
# same argument that lets `sequence` exist.
