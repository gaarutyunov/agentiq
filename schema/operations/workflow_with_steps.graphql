# The M1 acceptance traversal (SPEC.md §16): a workflow with its steps, over the
# read-only projection of `dbos.*`. Fixed depth — SQL/PGQ in PG19 has no
# variable-length paths (SPEC.md §3.3).
#
# The root field is the physical table name, which is what gopgql names a
# queryable root: workflow_status, operation_outputs, streams.
query WorkflowWithSteps($workflowUuid: ID!) {
  workflow_status(workflowUuid: $workflowUuid) {
    workflowUuid
    status
    name
    queueName
    createdAt
    steps {
      functionId
      functionName
      output
      error
    }
  }
}
