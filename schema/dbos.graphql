# Read-only projection of the `dbos.*` schema (SPEC.md §7.3).
#
# DBOS owns these tables and migrates them with `dbos migrate`. Every type here
# is `@readonly`, so gopgql emits no CREATE TABLE, no ALTER, no DROP and no
# index for them — only the property-graph mapping and the read model.
#
# The directive vocabulary and the DateTime / JSON scalars are supplied by
# gopgql's own prelude and must not be redeclared here: declaring them is a
# duplicate-definition error. SPEC.md §7.1's preamble names an idealised
# vocabulary (`@table`, `@vertex`, `@edge`); the vocabulary gopgql actually
# implements is `@node`, `@key`, `@relationship`, and it is what this document
# uses. The mapping is one-to-one:
#
#   @table(name:, schema:)  ->  @node(label:, table:, schema:)
#   @vertex(key: [cols])    ->  @key(fields: [graphql field names])
#   @edge(from:, to:, label:) -> @relationship(type:, direction:,
#                                              table:, schema:,
#                                              sourceKey:, destKey:)
#
# `@key(fields:)` takes GraphQL field names; `sourceKey:`/`destKey:` take
# physical column names of the *edge* table.
#
# SPEC.md §7.1 also declares a `JSONB` scalar. gopgql's prelude has `JSON`
# only, so a column that is physically `jsonb` is `JSON @column(type: "jsonb")`.
# For a @readonly type the physical type is never emitted as DDL; it only tells
# the compiler how to shape the value back.
#
# `Workflow.sessions` (SPEC.md §7.3's HAS_SESSION edge) arrived in M2, when
# `schema/agentiq.graphql` did. The two documents are concatenated by
# `tools/sdlmerge` before gopgql runs, because `--sdl` takes one file and a
# property graph can only span `dbos.*` and `agentiq.*` if one document
# describes both.
#
# `workflow_uuid` is TEXT, and is declared so here. SPEC.md §7.3 writes it
# `ID!`, and M1 followed that; gopgql maps `ID` to uuid, which was invisible
# while every table in this graph was `@readonly` and emitted no DDL. It stops
# being invisible the moment `agentiq.session.workflow_uuid` — a column gopgql
# does create — has to hold the same value: a graph whose two sides disagree is
# rejected outright ("property \"workflow_uuid\" is text on \"agentiq.session\"
# but uuid on \"dbos.workflow_status\"; a property name has one type across the
# whole graph"), and one that agreed on uuid would emit an edge joining a uuid
# column to a text one. `@column(type: "text")` states what the column is; see
# test/drift/testdata/dbos_schema.json.
#
# SPEC.md §7.3 also writes `parent` and `childWorkflow` as to-one fields.
# gopgql refuses a non-list `@relationship` field ("@relationship fields must be
# list types"), so both are `[Workflow!]!` here — a list that holds at most one
# element. It has no cardinality directive to say otherwise.
#
# `HAS_STEP` (Workflow → Step) and `SPAWNED` (Step → Workflow) both map onto
# `dbos.operation_outputs`. That is deliberate and gopgql ≥ v0.2.1 emits both as
# distinct edge elements, keyed by relationship label rather than by physical
# table. Do not delete one to make the DDL look tidier: `HAS_STEP` is the
# traversal SPEC.md §16's M1 acceptance is written against, and `SPAWNED` is how
# a workflow reaches the children it started.

type Workflow
  @node(label: "workflow", table: "workflow_status", schema: "dbos")
  @readonly
  @key(fields: ["workflowUuid"]) {
  workflowUuid:     ID!       @column(name: "workflow_uuid", type: "text")
  status:           String!
  name:             String!
  queueName:        String    @column(name: "queue_name")
  # SPEC.md §7.3 types these `DateTime!`. They are not timestamps.
  # `dbos.workflow_status.created_at` and `updated_at` are BIGINT holding
  # milliseconds since the Unix epoch (confirmed by introspection — see
  # test/drift/testdata/dbos_schema.json, and DBOS's own
  # `started_at_epoch_ms` / `completed_at_epoch_ms` / `workflow_timeout_ms`,
  # which are named for it).
  #
  # Declaring them DateTime does not fail generation, it fails at *runtime*:
  # gopgql's shaper rejects the row with "createdAt is DateTime, so it should
  # have arrived as a timestamp, but it arrived as int64", which takes down
  # SPEC.md §16's M1 acceptance query in both the server build and the browser
  # build. `Int` is what the column is; a caller that wants a time.Time builds
  # one from the epoch.
  createdAt:        Int! @column(name: "created_at")
  updatedAt:        Int! @column(name: "updated_at")
  recoveryAttempts: Int       @column(name: "recovery_attempts")
  # SPEC.md §7.3 types the payload columns `JSON`. They are not JSON.
  # `inputs`, `output` and `error` are TEXT holding whatever DBOS's serializer
  # produced — by default a base64-encoded gob blob, not a JSON document (the
  # sibling `serialization` column records which encoding was used). Declaring
  # them JSON fails at read time, not at generation time: gopgql's shaper
  # rejects the row with `output is not a valid JSON document: invalid
  # character 'I' looking for beginning of value`, which is the first byte of
  # the base64.
  #
  # `attributes` really is `jsonb` and stays JSON.
  #
  # They are String here: an opaque payload whose encoding the `serialization`
  # column names. A consumer that wants the value decodes it with the DBOS
  # serializer, which is the only thing that can.
  attributes:       JSON      @column(type: "jsonb")
  inputs:           String
  output:           String
  error:            String

  steps: [Step!]! @relationship(
    type: "HAS_STEP", direction: OUT
    table: "operation_outputs", schema: "dbos"
    sourceKey: ["workflow_uuid"], destKey: ["workflow_uuid", "function_id"]
  )

  parent: [Workflow!]! @relationship(
    type: "PARENT", direction: OUT
    table: "workflow_status", schema: "dbos"
    sourceKey: ["workflow_uuid"], destKey: ["parent_workflow_id"]
  )

  # SPEC.md §6.2, §7.3. The edge that makes the graph span two schemas: the
  # edge table is `agentiq.session`, which AgentIQ owns and migrates, while the
  # source vertex is a `dbos.*` table it only reads. `agentiq.session.id` is
  # gopgql's surrogate uuid, not ADK's session id — see schema/agentiq.graphql.
  sessions: [Session!]! @relationship(
    type: "HAS_SESSION", direction: OUT
    table: "session", schema: "agentiq"
    sourceKey: ["workflow_uuid"], destKey: ["id"]
  )

  streams: [StreamValue!]! @relationship(
    type: "EMITTED", direction: OUT
    table: "streams", schema: "dbos"
    sourceKey: ["workflow_uuid"], destKey: ["workflow_uuid", "key", "offset"]
  )
}

type Step
  @node(label: "step", table: "operation_outputs", schema: "dbos")
  @readonly
  @key(fields: ["workflowUuid", "functionId"]) {
  workflowUuid: ID!    @column(name: "workflow_uuid", type: "text")
  functionId:   Int!   @column(name: "function_id")
  functionName: String @column(name: "function_name")
  # TEXT holding a serializer payload, not JSON. See the note on Workflow.
  output:       String
  error:        String

  childWorkflow: [Workflow!]! @relationship(
    type: "SPAWNED", direction: OUT
    table: "operation_outputs", schema: "dbos"
    sourceKey: ["workflow_uuid", "function_id"], destKey: ["child_workflow_id"]
  )
}

type StreamValue
  @node(label: "stream_value", table: "streams", schema: "dbos")
  @readonly
  @key(fields: ["workflowUuid", "key", "seq"]) {
  workflowUuid: ID!     @column(name: "workflow_uuid", type: "text")
  key:          String!
  seq:          Int!    @column(name: "offset") # `offset` is reserved; quoted
  # TEXT holding a serializer payload, not JSON. See the note on Workflow.
  value:        String
  functionId:   Int     @column(name: "function_id")
}

type Mutation {
  # SPEC.md §7.4. DBOS exposes enqueue, not direct start: every externally
  # triggered run passes through a DBOS queue. `queue`'s GraphQL default is
  # "agent"; an argument the operation does not pass is left out of the call
  # entirely, so the function's own SQL DEFAULT applies (passing null sends
  # NULL, which is a different thing).
  startAgentRun(
    agentDigest: String! @column(name: "agent_digest")
    userId: String! @column(name: "user_id")
    input: JSON! @column(name: "input")
    queue: String = "agent" @column(name: "queue")
    deduplicationId: String @column(name: "deduplication_id")
    priority: Int @column(name: "priority")
  ): String! @function(schema: "dbos", name: "enqueue_workflow")

  # SPEC.md §8.3 and D2: one event, five tables, one call.
  #
  # It is a `@function` and not a generated write because gopgql has no
  # generated writes — "gopgql derives no writes of its own; there is no
  # generated `createPerson` and no inferred input type — it calls what the SDL
  # names". `agentiq.append_event` is created by migrate/sql/0002.
  #
  # One call rather than five is what makes D2 reachable. `RunAsTransaction`
  # commits the step checkpoint in the caller's transaction; five round-trips
  # from Go would put the checkpoint atomically with only the last of them, and
  # a crash between the third and the fourth would leave an event with some of
  # its parts and a checkpoint saying it was appended.
  #
  # The five documents are JSON rather than typed arguments because the rows
  # they carry have around seventy columns between them, and a seventy-argument
  # PL/pgSQL signature is one whose call sites go wrong silently. Postgres
  # unpacks them with `json_populate_record`, so the column names are checked by
  # the server against the real tables rather than by position.
  #
  # This field sits in the `dbos.*` document only because a GraphQL document has
  # one `type Mutation`, and this is where it is declared. It is AgentIQ's own.
  appendEvent(
    sessionId: ID! @column(name: "p_session_id")
    event: JSON! @column(name: "p_event")
    parts: JSON! @column(name: "p_parts")
    actions: JSON! @column(name: "p_actions")
    stateDeltas: JSON! @column(name: "p_state_deltas")
    artifactDeltas: JSON! @column(name: "p_artifact_deltas")
  ): ID! @function(schema: "agentiq", name: "append_event")
}
